[project]
name = "kivo"
version = "0.1.0"
description = "Host-side backend (the brain) for the Kivo desk companion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Webcam emotion sensing (kivo run --camera). Free + local: OpenCV runs a small
# ONNX emotion model on the CPU; no paid API. Install with: pip install -e .[vision]
vision = [
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.scripts]
kivo = "kivo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kivo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
