; Kivo firmware — PlatformIO project (see docs/adr/0002-platformio-firmware.md).
;
;   pio run                 build for the Uno
;   pio run -t upload       flash the connected Uno
;   pio device monitor      watch the serial link (115200 baud)
;   pio test -e native      run host-side protocol unit tests (no board needed)

[env]
build_flags = -Wall -Wextra

; --- Target: the physical ELEGOO Uno R3 -------------------------------------
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
; Character-LCD driver (HD44780). Pinned so builds are reproducible.
lib_deps = arduino-libraries/LiquidCrystal@^1.0.7
; Firmware runs on the board; host-only tests must not be flashed to it.
test_ignore = *

; --- Host build for fast unit testing of the portable protocol library ------
[env:native]
platform = native
test_framework = unity
